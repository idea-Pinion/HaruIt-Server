name: Spring CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 25 설정
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle 실행 권한 부여
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

      - name: HaruIt CI Discord Notifications
        if: ${{ !cancelled() }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_SERVER_WEBHOOK }}
          status: ${{ job.status }}
          title: ${{ job.status == 'success' && '✅ 성공 ✅' || '❗️ 실패 ❗️' }}
          description: Spring Boot 빌드 ${{ job.status == 'success' && '성공' || '실패' }}
          username: Server-bot